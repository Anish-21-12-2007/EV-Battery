  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1800" height="1060" fill="#f8fafc"/>
  <rect x="24" y="20" width="1752" height="1020" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="44" y="38" width="1712" height="92" rx="12" fill="#0f172a"/>
  <text x="72" y="76" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f8fafc">
    12 V Two-Load (Light + Motor) Energy Monitoring — Upgraded System Block Architecture
  </text>
  <text x="72" y="108" font-family="Arial, sans-serif" font-size="15.5" fill="#cbd5e1">
    Documentary Engineering Concept Only • Separate Branch Current &amp; Input-Boundary Voltage Channels • Dedicated Kelvin Star Return (JGND) • Strictly Separate from 96 V EV Proxy
  </text>

  <!-- Legend Bar -->
  <rect x="44" y="144" width="1712" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="70" y1="166" x2="125" y2="166" stroke="#b91c1c" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#arrRed)"/>
  <text x="138" y="171" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Switched DC Power Path (Ratings TBD)</text>

  <line x1="445" y1="166" x2="500" y2="166" stroke="#334155" stroke-width="3.5" stroke-dasharray="8 5" marker-end="url(#arrSlate)"/>
  <text x="513" y="171" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Dedicated Home-Run Return to JGND Star</text>

  <line x1="840" y1="166" x2="895" y2="166" stroke="#6d28d9" stroke-width="3.5" stroke-dasharray="8 5" marker-end="url(#arrPurple)"/>
  <text x="908" y="171" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Analog Sense &amp; Conditioning Path (ADC1)</text>

  <line x1="1245" y1="166" x2="1300" y2="166" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
  <text x="1313" y="171" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Digital Calculation / Energy Integration Boundary</text>

  <!-- Source & Distribution Column -->
  <rect x="60" y="290" width="205" height="135" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="162" y="324" font-family="Arial, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" fill="#0f172a">BAT1: 12 V, 7.6 Ah</text>
  <text x="162" y="350" font-family="Arial, sans-serif" font-size="13.5" text-anchor="middle" fill="#475569">Amptek listing candidate (S5)</text>
  <text x="162" y="372" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#b45309" font-weight="700">91.2 Wh nominal product only</text>
  <text x="162" y="394" font-family="Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#64748b">Usable Ah, I_sc &amp; cutoffs TBD</text>

  <rect x="320" y="290" width="215" height="135" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="427" y="324" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#78350f">F1 + RP1 + SW1</text>
  <text x="427" y="348" font-family="Arial, sans-serif" font-size="13.5" text-anchor="middle" fill="#92400e">F1 near BAT+ (W001/W002)</text>
  <text x="427" y="370" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#92400e">Reverse-Pol RP1 &amp; SW1 DC</text>
  <text x="427" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b45309">All ratings TBD (S6, S7)</text>

  <rect x="590" y="290" width="205" height="135" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
  <text x="692" y="324" font-family="Arial, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" fill="#881337">BUS+ Node &amp; TVS1</text>
  <text x="692" y="348" font-family="Arial, sans-serif" font-size="13.5" text-anchor="middle" fill="#9f1239">Insulated busbar (W003)</text>
  <text x="692" y="370" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9f1239">3 fused branch takeoffs</text>
  <text x="692" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#be123c">TVS1 clamp TBD (W060)</text>

  <path d="M265 355 H320" stroke="#b91c1c" stroke-width="4.5" stroke-dasharray="9 6" fill="none" marker-end="url(#arrRed)"/>
  <text x="292" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b91c1c">W001</text>

  <path d="M535 355 H590" stroke="#b91c1c" stroke-width="4.5" stroke-dasharray="9 6" fill="none" marker-end="url(#arrRed)"/>
  <text x="562" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b91c1c">W002/03</text>

  <!-- Three Parallel Branches from BUS+ (Clear routing corridor x=795..910) -->
  <path d="M795 340 H830 V255 H910" stroke="#b91c1c" stroke-width="4" stroke-dasharray="9 6" fill="none" marker-end="url(#arrRed)"/>
  <path d="M795 355 H910" stroke="#b91c1c" stroke-width="4" stroke-dasharray="9 6" fill="none" marker-end="url(#arrRed)"/>
  <path d="M830 355 V595 H910" stroke="#b91c1c" stroke-width="4" stroke-dasharray="9 6" fill="none" marker-end="url(#arrRed)"/>

  <!-- Branch 1: Light (x=910, width=330) -->
  <rect x="910" y="205" width="330" height="125" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1075" y="235" font-family="Arial, sans-serif" font-size="17.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Branch 1: FL → S_L → L1 Light</text>
  <text x="1075" y="259" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b21b6">• W004–W006: Series current sensor S_L (TBD)</text>
  <text x="1075" y="280" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b21b6">• W022–W023: Conditioner U_I_L → GPIO32 (ADC1_CH4)</text>
  <text x="1075" y="301" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b21b6">• W024–W030: 68k/10k + 100nF → GPIO33 (ADC1_CH5)</text>

  <!-- Branch 2: Motor Controller & Motor (x=910, width=330) -->
  <rect x="910" y="360" width="330" height="145" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1075" y="390" font-family="Arial, sans-serif" font-size="17.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Branch 2: FM → S_M → MDRV → M1</text>
  <text x="1075" y="414" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b21b6">• W008–W010: ACS712-30A candidate before MDRV input</text>
  <text x="1075" y="435" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b21b6">• W031–W037: 27k/20k + 100nF → GPIO34 (ADC1_CH6)</text>
  <text x="1075" y="456" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b21b6">• W038–W044: 68k/10k + 100nF → GPIO35 (ADC1_CH7)</text>
  <text x="1075" y="477" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b45309">• W054–W055: MDRV switched output to Motor M1</text>

  <!-- Branch 3: Electronics (x=910, width=330) -->
  <rect x="910" y="535" width="330" height="150" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1075" y="565" font-family="Arial, sans-serif" font-size="17.5" font-weight="700" text-anchor="middle" fill="#1e3a8a">Branch 3: F2 → DC/DC → U_ESP</text>
  <text x="1075" y="589" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">• W012–W015: F2 (TBD) → LM2596 IC? (4.5–40 V max)</text>
  <text x="1075" y="610" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">• W018, W020: Regulated 5.00 V sensor supply rail</text>
  <text x="1075" y="631" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e40af">• W045–W051: Optional 3.3V I²C OLED &amp; DS18B20</text>
  <text x="1075" y="654" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b91c1c">• Excludes electronics draw from branch load sum</text>

  <!-- Kelvin Star Ground & Return Topology Block (x=60, width=735) -->
  <rect x="60" y="535" width="735" height="150" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <text x="82" y="566" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">JGND: Kelvin Star-Ground &amp; Dedicated Return Architecture (Corrected)</text>
  <text x="82" y="592" font-family="Arial, sans-serif" font-size="13.5" fill="#334155">1. High-Current Returns (STAR_RETURN): L1 (W007), MDRV (W011), and Buck IN− (W014) use</text>
  <text x="98" y="612" font-family="Arial, sans-serif" font-size="13.5" fill="#334155">separate dedicated conductors directly to the battery-negative star busbar (W052 to BAT1−).</text>
  <text x="82" y="638" font-family="Arial, sans-serif" font-size="13.5" fill="#334155">2. Quiet Analog Reference (LOGIC_GND): ESP32 GND (W017), Buck OUT− (W016), S_L/S_M GND,</text>
  <text x="98" y="658" font-family="Arial, sans-serif" font-size="13.5" fill="#334155">and divider/filter returns (W027–W043) join LOGIC_GND, linked at one Kelvin tie (W053).</text>

  <!-- Return arrows from branches in clean corridor x=855..885 to JGND (x=795) -->
  <path d="M162 425 V535" stroke="#334155" stroke-width="4" stroke-dasharray="8 5" fill="none" marker-end="url(#arrSlate)"/>
  <text x="205" y="485" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">W052 (BAT−)</text>

  <path d="M910 300 H880 V575 H795" stroke="#334155" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#arrSlate)"/>
  <path d="M910 475 H860 V615 H795" stroke="#334155" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#arrSlate)"/>
  <path d="M910 655 H795" stroke="#334155" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#arrSlate)"/>

  <!-- Right Column: Power, Energy & Cost Boundary -->
  <path d="M1240 265 H1310" stroke="#6d28d9" stroke-width="3.5" stroke-dasharray="8 5" fill="none" marker-end="url(#arrPurple)"/>
  <path d="M1240 435 H1310" stroke="#6d28d9" stroke-width="3.5" stroke-dasharray="8 5" fill="none" marker-end="url(#arrPurple)"/>

  <rect x="1310" y="210" width="420" height="115" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1520" y="242" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#4c1d95">Light Branch Power &amp; Energy</text>
  <text x="1520" y="268" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e293b">P_L(t) = V_L(t) × I_L(t)</text>
  <text x="1520" y="292" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">E_L(Wh) = Σ [V_L,k × I_L,k × Δt_k] / 3600</text>
  <text x="1520" y="312" font-family="Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#64748b">Sensed at L1 DC input boundary (GPIO32 &amp; GPIO33)</text>

  <rect x="1310" y="375" width="420" height="115" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1520" y="407" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#4c1d95">Motor Branch Power &amp; Energy</text>
  <text x="1520" y="433" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e293b">P_M(t) = V_M(t) × I_M(t)</text>
  <text x="1520" y="457" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">E_M(Wh) = Σ [V_M,k × I_M,k × Δt_k] / 3600</text>
  <text x="1520" y="477" font-family="Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#64748b">Sensed at MDRV DC supply input boundary (GPIO34 &amp; GPIO35)</text>

  <path d="M1520 325 V375" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <path d="M1520 490 V545" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 5" fill="none" marker-end="url(#arrBlue)"/>

  <rect x="1310" y="545" width="420" height="110" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="1520" y="576" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#14532d">Combined Two-Load Output</text>
  <text x="1520" y="602" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">P_total = P_L + P_M   |   E_total = E_L + E_M</text>
  <text x="1520" y="625" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#15803d">Never add an upstream battery sensor total to E_L + E_M</text>
  <text x="1520" y="644" font-family="Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#475569">(Doing so double-counts both load branches)</text>

  <path d="M1520 655 V705" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 5" fill="none" marker-end="url(#arrBlue)"/>

  <rect x="1310" y="705" width="420" height="95" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1520" y="736" font-family="Arial, sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#78350f">Grid Billing Boundary: Cost = E_grid(kWh) × Tariff</text>
  <text x="1520" y="760" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#92400e">Status: N/A (Tariff &amp; charger/conversion efficiency undefined)</text>
  <text x="1520" y="782" font-family="Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#b45309">24 Wh × ₹8/kWh = ₹0.192 is a synthetic arithmetic example only</text>

  <!-- Bottom Safety & Separation Callout Box -->
  <rect x="60" y="715" width="1180" height="295" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="88" y="750" font-family="Arial, sans-serif" font-size="19.5" font-weight="700" fill="#881337">
    Mandatory Engineering Boundaries &amp; Safety Audit Rules Carried With This Diagram
  </text>
  <text x="88" y="782" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    • <tspan font-weight="700" fill="#9f1239">Strict 12 V vs. 96 V Separation:</tspan> This 12 V educational monitor (18 V DC divider ceiling assumption, TI LM2596 IC 40 V max input,
  </text>
  <text x="104" y="804" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    non-automotive Allegro ACS712 IC) is completely separate from the repository's illustrative 96 V, 150 Ah EV simulator. Never interconnect them.
  </text>
  <text x="88" y="834" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    • <tspan font-weight="700" fill="#9f1239">Passive Dividers Are Not Protection:</tspan> 68 kΩ / 10 kΩ (k = 5/39) and 27 kΩ / 20 kΩ (k_I = 20/47) keep nominal 18 V and ±30 A signals inside
  </text>
  <text x="104" y="856" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    Espressif's 150–2450 mV ADC1 window, but do not protect GPIOs against inductive spikes, open ground legs, or unpowered-MCU backfeed (&gt;0.3 V when VDD=0 V).
  </text>
  <text x="88" y="886" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    • <tspan font-weight="700" fill="#9f1239">Small-Load Resolution Limit on S_L:</tspan> An ACS712-30A (28.085 mV/A scaled) shifts by only 14.04 mV at 0.5 A against a ±60 mV ADC error
  </text>
  <text x="104" y="908" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    budget (±2.14 A = ±427% error). S_L must be sized to the actual Light load (e.g., dedicated low-range transducer or digital I²C high-side shunt monitor).
  </text>
  <text x="88" y="938" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    • <tspan font-weight="700" fill="#9f1239">Unresolved Ratings Flagged TBD:</tspan> F1, FL, FM, F2, SW1, WIRE gauges, S_L, U_I_L, MDRV, M1, L1, D1, TVS1, RP1, and PCB breakouts
  </text>
  <text x="104" y="960" font-family="Arial, sans-serif" font-size="14.5" fill="#1e293b">
    require physical identification, fault-current calculation, and I²t coordination before any student lab construction or energization.
  </text>
  <text x="88" y="992" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#475569">
    Document Ref: FINAL_EV_EMS_ENGINEERING_PACKAGE / 01_System_Overview/circuit_block_diagram.svg • Cross-checked with wiring_connections.csv (W001–W060)
  </text>
</svg>
