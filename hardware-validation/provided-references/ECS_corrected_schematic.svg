<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1400" height="860" fill="#f6f8fb"/>
<text x="30" y="40" font-size="26" font-weight="bold" fill="#14213d">ECS Battery Monitoring — CORRECTED architecture (audit rev.)</text>
<text x="30" y="66" font-size="14" fill="#555">CONDITIONAL / not electrically verified. Rows match battery-monitoring-pinout_CORRECTED.csv. No simulated or placeholder values.</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<g stroke-width="5" fill="none">
<path d="M170,170 H240" stroke="#c0392b"/><path d="M380,170 H450" stroke="#c0392b"/><path d="M590,170 H700" stroke="#c0392b"/><path d="M860,170 H960" stroke="#c0392b"/>
<path d="M960,170 V150 H1130" stroke="#c0392b"/>
<path d="M960,170 V300 H1000" stroke="#c0392b" stroke-width="3"/>
<path d="M960,170 V380 H1000" stroke="#c0392b" stroke-width="3"/>
<path d="M1260,170 H1330 V560 H90 V215" stroke="#222"/>
</g>
<g font-size="14" fill="#14213d" stroke="#445" stroke-width="2">
<rect x="30" y="120" width="140" height="95" rx="10" fill="#fff"/><rect x="240" y="135" width="140" height="70" rx="10" fill="#fff"/>
<rect x="450" y="135" width="140" height="70" rx="10" fill="#fff"/><rect x="700" y="120" width="160" height="100" rx="10" fill="#fff"/>
<rect x="1130" y="120" width="130" height="100" rx="40" fill="#fff"/>
<rect x="1000" y="270" width="180" height="60" rx="10" fill="#fff3d6"/><rect x="1000" y="350" width="180" height="60" rx="10" fill="#fff"/>
</g>
<g font-size="14" fill="#14213d" text-anchor="middle">
<text x="100" y="150" font-weight="bold">12 V VRLA</text><text x="100" y="170">Amptek AT12-7.6</text><text x="100" y="190">BAT+ / BAT-</text>
<text x="310" y="165" font-weight="bold">F1 fuse</text><text x="310" y="185">rating: see rule</text>
<text x="520" y="165" font-weight="bold">SW1 rocker</text><text x="520" y="185">DC rating TBD</text>
<text x="780" y="150" font-weight="bold">ACS712-30A</text><text x="780" y="170">IP+ → IP−</text><text x="780" y="190">now sees ALL load</text>
<text x="1195" y="165" font-weight="bold">DC MOTOR</text><text x="1195" y="185">12 V-class, TBD</text>
<text x="1090" y="296" font-weight="bold">F2 1–2 A → LM2596</text><text x="1090" y="316">IN+ / IN−, set 5.00 V</text>
<text x="1090" y="376" font-weight="bold">R3 62k → node B</text><text x="1090" y="396">R4 10k to GND, C2 100 nF</text>
<text x="965" y="255" fill="#c0392b" font-weight="bold">LOAD BUS +</text>
</g>
<text x="400" y="545" font-size="14" font-weight="bold" fill="#222">Motor − and BAT− star post (separate return; buck IN− and logic GND meet here only)</text>
<g stroke="#445" stroke-width="2" fill="#fff">
<rect x="30" y="610" width="300" height="220" rx="12"/><rect x="380" y="610" width="280" height="105" rx="12"/><rect x="380" y="725" width="280" height="105" rx="12"/><rect x="710" y="610" width="320" height="100" rx="12"/><rect x="710" y="725" width="320" height="105" rx="12" fill="#fff3d6"/><rect x="1060" y="610" width="310" height="220" rx="12" fill="#fff"/>
</g>
<g font-size="13" fill="#14213d">
<text x="45" y="635" font-weight="bold" font-size="15">ESP32 dev board (30-pin, confirm labels)</text>
<text x="45" y="662">VIN/5V ← LM2596 5.00 V (one source only)</text><text x="45" y="684">GPIO34 ← node A (15k/20k + 100 nF)</text>
<text x="45" y="706">GPIO35 ← node B (62k/10k + 100 nF)</text><text x="45" y="728">GPIO21 SDA, GPIO22 SCL → OLED</text>
<text x="45" y="750">GPIO4 ↔ DS18B20 DQ (4.7k to 3V3)</text><text x="45" y="772">3V3 → OLED VCC, DS18B20 VDD</text>
<text x="45" y="794">GPIO25 reserved, NOT CONNECTED (relay)</text><text x="45" y="816">GND = logic ground (buck OUT−)</text>
<text x="395" y="635" font-weight="bold" font-size="15">0.96-in OLED</text><text x="395" y="660">VCC ← ESP32 3V3 (never 5 V)</text><text x="395" y="682">SDA/SCL ↔ GPIO21/22, GND</text><text x="395" y="704">addr 0x3C/0x3D: scan</text>
<text x="395" y="750" font-weight="bold" font-size="15">DS18B20 probe (added)</text><text x="395" y="775">Taped to battery case wall</text><text x="395" y="797">Case-surface temperature only</text>
<text x="725" y="635" font-weight="bold" font-size="15">ACS signal chain</text><text x="725" y="660">VIOUT → 15k → node A → 20k → GND</text><text x="725" y="682">100 nF node A to GND; range −30…+27 A</text>
<text x="725" y="750" font-weight="bold" font-size="15">Relay / motor switching</text><text x="725" y="775">NOT CONNECTED in Phase 1</text><text x="725" y="797">Rocker switch is the motor on/off</text>
<text x="1075" y="635" font-weight="bold" font-size="15">Rules</text>
<text x="1075" y="662">• Zero-current offset auto-calibrated at boot</text><text x="1075" y="684">• Power = V_bus × I_batt (battery input)</text>
<text x="1075" y="706">• Motor status inferred from current</text><text x="1075" y="728">• SoC/Ah/Wh = ESTIMATES (labelled)</text>
<text x="1075" y="750">• Missing sensor → null/"--", never 0</text><text x="1075" y="772">• 12 V never to any GPIO/ADC/3V3/OLED</text>
<text x="1075" y="794">• Nothing here is VERIFIED on hardware</text>
</g>
<g font-size="12" fill="#14213d"><text x="30" y="590">Legend: red = high-current +, dark = return, thin red = branch from load bus. Low-voltage wiring detailed in the CSV.</text></g>
</svg>
